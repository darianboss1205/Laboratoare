
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>JS 3 - Ordinea executarii</title>
</head>
<body>
    <h1>Ordinea executarii JavaScript</h1>

    <script>
        window.alert("Prima alerta: incepe incarcarea paginii.");

        var a = 35;
        var b = 6;
        var c = 5;

        console.log("Rezultatul este: " + (a + c) + b);
        console.log("35 + 5 = " + (a + c));
        console.log("35 + 5, apoi concatenare cu 6: " + ((a + c) + "" + b));
    </script>

    <p>Deschide consola cu F12 si selecteaza Console.</p>
    <p><a href="index.html">Înapoi la laborator</a></p>
</body>
</html>
