

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 2 - Paragraf</title>
</head>
<body>
    <h1>Schimbarea culorilor paragrafului</h1>

    <p
        style="background-color: yellow; color: blue; padding: 15px;"
        onmouseover="this.style.backgroundColor='blue'; this.style.color='yellow';"
        onmouseout="this.style.backgroundColor='yellow'; this.style.color='blue';">
        Paragraf de modificat
    </p>

    <a href="index.html">Înapoi la exerciții</a>
</body>
</html>
