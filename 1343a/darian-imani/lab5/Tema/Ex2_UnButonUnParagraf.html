

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 3 - Buton si paragraf</title>
</head>
<body>
    <h1>Schimbarea culorilor la clic</h1>

    <p id="paragraf" style="padding: 15px;">
        Acesta este un paragraf.
    </p>

    <button onclick="
        document.getElementById('paragraf').style.backgroundColor='pink';
        document.getElementById('paragraf').style.color='red';
    ">
        Schimbă culorile
    </button>

    <p><a href="index.html">Inapoi la exercitii</a></p>
</body>
</html>
