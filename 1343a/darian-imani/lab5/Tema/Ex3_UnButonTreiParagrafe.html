

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 4 - Trei paragrafe</title>

    <script>
        function modificaParagrafe() {
            document.getElementById("p1").innerHTML =
                "Acesta este paragraful 1";

            document.getElementById("p2").innerHTML =
                "Acesta este paragraful 2";

            document.getElementById("p3").innerHTML =
                "Acesta este paragraful 3";

            document.getElementById("p1").style.color = "red";
            document.getElementById("p1").style.backgroundColor = "pink";

            document.getElementById("p2").style.color = "blue";
            document.getElementById("p2").style.backgroundColor = "lightblue";

            document.getElementById("p3").style.color = "green";
            document.getElementById("p3").style.backgroundColor = "lightgreen";
        }
    </script>
</head>
<body>
    <h1>Trei paragrafe</h1>

    <p id="p1">Primul paragraf inițial</p>
    <p id="p2">Al doilea paragraf inițial</p>
    <p id="p3">Al treilea paragraf inițial</p>

    <button onclick="modificaParagrafe()">
        Modifică paragrafele
    </button>

    <p><a href="index.html">Înapoi la exerciții</a></p>
</body>
</html>
