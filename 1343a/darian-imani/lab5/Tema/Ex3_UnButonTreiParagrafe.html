
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 4 - Trei paragrafe</title>

    <script>
        function modificaParagrafe() {
            document.getElementById("p1").innerHTML =
                "Acesta este paragraful 1";
            document.getElementById("p1").style.color = "red";
            document.getElementById("p1").style.backgroundColor = "yellow";

            document.getElementById("p2").innerHTML =
                "Acesta este paragraful 2";
            document.getElementById("p2").style.color = "blue";
            document.getElementById("p2").style.backgroundColor = "lightgreen";

            document.getElementById("p3").innerHTML =
                "Acesta este paragraful 3";
            document.getElementById("p3").style.color = "white";
            document.getElementById("p3").style.backgroundColor = "purple";
        }
    </script>
</head>
<body>
    <h1>Modificarea celor trei paragrafe</h1>

    <p id="p1">Paragraful initial 1</p>
    <p id="p2">Paragraful initial 2</p>
    <p id="p3">Paragraful initial 3</p>

    <button onclick="modificaParagrafe()">
        Modifica paragrafele
    </button>

    <p><a href="index.html">Înapoi la temă</a></p>
</body>
</html>
