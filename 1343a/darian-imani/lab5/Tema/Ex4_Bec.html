<body>
    <h1>Becul se aprinde si se stinge</h1>

    <p>Muta mouse-ul peste bec pentru a-l aprinde.</p>

    <img
        src="Bec stins.gif"
        alt="Bec stins"
        onmouseover="this.src='Bec aprins.gif'; this.alt='Bec aprins';"
        onmouseout="this.src='Bec stins.gif'; this.alt='Bec stins';"
    >
