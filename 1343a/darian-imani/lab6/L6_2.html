
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Acest titlu va fi modificat cu JS</title>
</head>
<body>

<p>Salutare, <br> oameni buni! <br> (De modificat culoarea de background cu js!)</p>

<p>Folositi metoda <b>getElementsByTagName</b> pentru a modifica culorile indicate in paragrafele alaturate!</p>

<p>Acest text va fi colorat <br> folosind <br> JavaScript</p>

<script>
    var p = document.getElementsByTagName("p");

    p[0].style.backgroundColor = "yellow";
    p[2].style.color = "blue";

    document.title = "Pagina modificata prin JavaScript";
</script>

</body>
</html>
