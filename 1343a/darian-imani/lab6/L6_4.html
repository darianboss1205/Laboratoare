
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Modificare imagini</title>
</head>
<body>

<h3>Utilizati JavaScript si HTML DOM pentru a inlocui imaginile</h3>

Pisici
<hr>
<img class="animal" src="Pesti.jpg" alt="Pisici" width="160" height="120">
<br><br>

Munti
<hr>
<img class="peisaj" src="desert.jpg" alt="Munti" width="160" height="120">
<br><br>

Caini
<hr>
<img class="animal" src="egrete.jpg" alt="Caini" width="160" height="120">
<br><br>

Mare
<hr>
<img class="peisaj" src="jungla.jpg" alt="Mare" width="160" height="120">

<script>
    var animale = document.getElementsByClassName("animal");
    var peisaje = document.getElementsByClassName("peisaj");

    animale[0].src = "Img/pisici.jpg";
    animale[1].src = "Img/caini.jpg";

    peisaje[0].src = "Img/munti.jpg";
    peisaje[1].src = "Img/mare.jpg";
</script>

</body>
</html>
