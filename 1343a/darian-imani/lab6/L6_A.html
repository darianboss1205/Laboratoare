

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercitiul 1</title>
</head>
<body>
    <p id="par">Text initial</p>

    <script>
        var text = prompt(
            "Introduceti noul text al paragrafului:",
            "Text initial"
        );

        if (text !== null && text !== "") {
            document.getElementById("par").textContent = text;
        }
    </script>
</body>
</html>
