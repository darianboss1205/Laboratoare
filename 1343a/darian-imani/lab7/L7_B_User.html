<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Verificare user</title>
    <script>
        function verificaUser() {
            var u = document.getElementById("user").value;
            if (!localStorage.getItem(u)) {
                alert("User incorect!");
            } else {
                var p = document.getElementById("pass").value;
                if (p === localStorage.getItem(u)) {
                    alert("OK");
                } else {
                    alert("Parola incorecta.");
                }
            }
        }

        function inscrieUser() {
            var un = document.getElementById("user").value;
            if (!un) {
                alert("Introduceti un user.");
                return;
            }
            if (localStorage.getItem(un)) {
                alert("User existent!");
            } else {
                var pn = document.getElementById("pass").value;
                if (!pn) {
                    alert("Introduceti o parola.");
                    return;
                }
                localStorage.setItem(un, pn);
                alert("User inscris!");
            }
        }
    </script>
</head>
<body>
    <form onsubmit="return false;">
        <label for="user">User:</label><br>
        <input type="text" id="user" required><br>
        <label for="pass">Parola:</label><br>
        <input type="password" id="pass" required><br><br>
        <input type="button" value="Verificare" onclick="verificaUser()">
        <input type="button" value="Inscriere" onclick="inscrieUser()">
    </form>
</body>
</html>
