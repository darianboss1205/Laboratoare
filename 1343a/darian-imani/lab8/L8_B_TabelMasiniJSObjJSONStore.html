<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel masini</title>

<style>
table {
  font-family: Arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>

</head>

<body>

<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">

  <input id="marca" type="text"
         placeholder="Marca" required>

  <input id="model" type="text"
         placeholder="Model" required>

  <input id="culoare" type="text"
         placeholder="Culoare" required>

  <input id="anFab" type="number"
         placeholder="An fabricatie" required>

  <button type="submit">Adauga masina</button>

</form>

<p id="mesaj"></p>

<table id="tm">

<tr>
  <th>Marca</th>
  <th>Model</th>
  <th>Culoare</th>
  <th>An fabricatie</th>
</tr>

</table>

<script>

// Anul curent
var anCurent = new Date().getFullYear();

document.getElementById("anFab").max = anCurent;


// Functia constructor
function masina(mk, md, cl, an) {

  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;

  this.randNou = function() {

    return "<tr><td>" + this.marca +
    "</td><td>" + this.model +
    "</td><td>" + this.culoare +
    "</td><td>" + this.anFab +
    "</td></tr>";

  };

}


// Masinile initiale
var m1 = new masina("Opel", "Zafira", "gri", 2015);

var m2 = new masina("Seat", "Ibiza", "roz", 2018);

document.getElementById("tm").innerHTML += m1.randNou();

document.getElementById("tm").innerHTML += m2.randNou();


// Citirea obiectului JSON din Local Storage
if (localStorage.masinaN) {

  var masinaJSON = localStorage.masinaN;

  var mNoua = JSON.parse(masinaJSON);

  document.getElementById("tm").innerHTML += mNoua.randNou;

}


// Functia de validare
function valideaza(marca, model, culoare, an) {

  if (marca.trim() == "") {
    return "Marca nu poate fi goala!";
  }

  if (model.trim() == "") {
    return "Modelul nu poate fi gol!";
  }

  if (culoare.trim() == "") {
    return "Culoarea nu poate fi goala!";
  }

  var anNumar = Number(an);

  if (an.trim() == "" ||
      !Number.isInteger(anNumar) ||
      anNumar < 1900 ||
      anNumar > anCurent) {

    return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + "!";

  }

  return "";

}


// Functia de adaugare masina
function adaugaMasina() {

  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;


  // Validarea datelor
  var eroare = valideaza(marca, model, culoare, an);

  if (eroare != "") {

    document.getElementById("mesaj").innerHTML = eroare;

    return false;

  }


  marca = marca.trim();
  model = model.trim();
  culoare = culoare.trim();


  var mNoua = new masina(marca, model, culoare, Number(an));


  document.getElementById("tm").innerHTML += mNoua.randNou();


  // Transformam metoda in text HTML
  mNoua.randNou = mNoua.randNou().toString();


  // Transformam obiectul in JSON
  var myJSON = JSON.stringify(mNoua);


  // Salvam obiectul JSON
  localStorage.setItem("masinaN", myJSON);


  document.getElementById("mesaj").innerHTML = "";

  document.querySelector("form").reset();

  return false;

}

</script>


<!--
EXERCITIUL 4

a) Cheia masinaN contine un obiect in format JSON.
Acesta contine marca, modelul, culoarea, anul de fabricatie
si randNou sub forma unui text HTML.

b) Linia mNoua.randNou = mNoua.randNou().toString();
apeleaza metoda randNou si inlocuieste functia cu textul
HTML returnat. JSON.stringify nu salveaza functiile.
Fara aceasta linie, proprietatea randNou ar fi omisa din JSON.

c) La reincarcare se scrie mNoua.randNou fara paranteze
deoarece randNou este deja un text HTML, nu o functie.
Daca am scrie paranteze, am incerca sa apelam un text.

d) Dupa reincarcarea paginii apare o singura masina adaugata,
deoarece fiecare salvare suprascrie cheia masinaN.
In L8_A se intampla acelasi lucru: apare doar ultima masina adaugata.
-->

</body>
</html>
