<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Gestiune mașini JSON</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: lightgray;
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        button {
            margin: 5px;
            padding: 6px 10px;
            cursor: pointer;
        }

        #formular {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid gray;
            width: 350px;
        }
    </style>
</head>

<body>

    <h1>Gestiune mașini</h1>

    <button onclick="loadTable()">Încarcă mașinile</button>
    <button onclick="openForm()">Adaugă mașină</button>

    <div id="tabel"></div>

    <div id="formular">
        <h3 id="titluFormular">Adaugă mașină</h3>

        <form id="frm">
            <label>Marca:</label>
            <input type="text" id="marca" required>
            <br>

            <label>Model:</label>
            <input type="text" id="model" required>
            <br>

            <label>Culoare:</label>
            <input type="text" id="culoare" required>
            <br>

            <label>Rând nou:</label>
            <input type="text" id="randNou" required>
            <br>

            <button type="button" onclick="salveazaMasina()">
                Salvează
            </button>

            <button type="button" onclick="closeForm()">
                Anulează
            </button>
        </form>
    </div>

    <script>
        let masini = [];
        let indexModificare = -1;

        // Constructorul pentru obiectul masina
        function Masina(marca, model, culoare, randNou) {
            this.marca = marca;
            this.model = model;
            this.culoare = culoare;
            this.randNou = randNou;
        }

        // Funcția AJAX pentru încărcarea fișierului JSON
        function getAJAX(url) {
            return fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Fișierul nu a putut fi încărcat.");
                    }
                    return response.json();
                });
        }

        // Încarcă datele din fișierul JSON
        function loadTable() {
            getAJAX("Masini_JSON.txt")
                .then(data => {
                    masini = [];

                    data.forEach(element => {
                        let masina = new Masina(
                            element.marca,
                            element.model,
                            element.culoare,
                            element.randNou
                        );

                        masini.push(masina);
                    });

                    afiseazaTabel();
                })
                .catch(error => {
                    alert("Eroare: " + error.message);
                });
        }

        // Afișează tabelul cu mașini
        function afiseazaTabel() {
            let html = `
                <table>
                    <tr>
                        <th>Marca</th>
                        <th>Model</th>
                        <th>Culoare</th>
                        <th>Rând nou</th>
                        <th>Acțiuni</th>
                    </tr>
            `;

            masini.forEach((masina, index) => {
                html += `
                    <tr>
                        <td>${masina.marca}</td>
                        <td>${masina.model}</td>
                        <td>${masina.culoare}</td>
                        <td>${masina.randNou}</td>
                        <td>
                            <button onclick="modificaMasina(${index})">
                                Modifică
                            </button>

                            <button onclick="stergeMasina(${index})">
                                Șterge
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += "</table>";

            document.getElementById("tabel").innerHTML = html;
        }

        // Șterge o mașină
        function stergeMasina(index) {
            if (confirm("Sigur dorești să ștergi această mașină?")) {
                masini.splice(index, 1);
                afiseazaTabel();
            }
        }

        // Deschide formularul pentru adăugare
        function openForm() {
            indexModificare = -1;

            document.getElementById("titluFormular").innerText =
                "Adaugă mașină";

            document.getElementById("frm").reset();

            document.getElementById("formular").style.display = "block";
        }

        // Deschide formularul pentru modificare
        function modificaMasina(index) {
            indexModificare = index;

            let masina = masini[index];

            document.getElementById("marca").value = masina.marca;
            document.getElementById("model").value = masina.model;
            document.getElementById("culoare").value = masina.culoare;
            document.getElementById("randNou").value = masina.randNou;

            document.getElementById("titluFormular").innerText =
                "Modifică mașina";

            document.getElementById("formular").style.display = "block";
        }

        // Salvează o mașină nouă sau modificările
        function salveazaMasina() {
            let marca = document.getElementById("marca").value;
            let model = document.getElementById("model").value;
            let culoare = document.getElementById("culoare").value;
            let randNou = document.getElementById("randNou").value;

            if (!marca || !model || !culoare || !randNou) {
                alert("Completează toate câmpurile!");
                return;
            }

            let masinaNoua = new Masina(
                marca,
                model,
                culoare,
                randNou
            );

            if (indexModificare === -1) {
                masini.push(masinaNoua);
            } else {
                masini[indexModificare] = masinaNoua;
            }

            afiseazaTabel();
            closeForm();
        }

        // Închide formularul
        function closeForm() {
            document.getElementById("formular").style.display = "none";
            document.getElementById("frm").reset();
        }
    </script>

</body>
</html>
