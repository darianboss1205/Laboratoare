
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Gestiune mașini</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: lightgray;
        }

        button {
            margin: 5px;
            padding: 7px;
        }

        input {
            padding: 7px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h2>Gestiune mașini folosind JSON</h2>

    <button onclick="getAJAX()">Încarcă array</button>

    <p id="mesaj"></p>

    <h3>Conținut JSON:</h3>
    <pre id="raw"></pre>

    <h3>Lista mașinilor:</h3>

    <table>
        <thead>
            <tr>
                <th>Marca</th>
                <th>Model</th>
                <th>Culoare</th>
                <th>Acțiuni</th>
            </tr>
        </thead>

        <tbody id="tabelMasini"></tbody>
    </table>

    <h3>Adaugă / Modifică mașină</h3>

    <form onsubmit="salveazaMasina(event)">
        <input type="text" id="marca" placeholder="Marca" required>
        <input type="text" id="model" placeholder="Model" required>
        <input type="text" id="culoare" placeholder="Culoare" required>

        <button type="submit">Adaugă / Salvează</button>
        <button type="button" onclick="reseteaza()">Anulează</button>
    </form>

    <script>

        let fileContent = "";
        let masini2Show = [];
        let indexEditare = -1;

        // Datele preluate din Masini_JSON.txt
        const masiniJSON = `[
            {
                "marca": "Dacia",
                "model": "Logan",
                "culoare": "albastra"
            },
            {
                "marca": "Nissan",
                "model": "Quasqai",
                "culoare": "verde"
            },
            {
                "marca": "AlaBala",
                "model": "PortoCala",
                "culoare": "grena"
            },
            {
                "marca": "Grand Jeep",
                "model": "Cherokee",
                "culoare": "negru"
            }
        ]`;

        // Încărcare array
        function getAJAX() {

            fileContent = masiniJSON;

            document.getElementById("raw").textContent = fileContent;

            masini2Show = JSON.parse(fileContent);

            document.getElementById("mesaj").textContent =
                "Array incarcat cu succes!";

            afiseazaTabel();
        }

        // Afișare tabel
        function afiseazaTabel() {

            let tabel = document.getElementById("tabelMasini");

            tabel.innerHTML = "";

            masini2Show.forEach((masina, index) => {

                let rand = tabel.insertRow();

                rand.insertCell().textContent = masina.marca;
                rand.insertCell().textContent = masina.model;
                rand.insertCell().textContent = masina.culoare;

                let actiuni = rand.insertCell();

                let modifica = document.createElement("button");
                modifica.textContent = "Modifică";
                modifica.onclick = function() {
                    modificaMasina(index);
                };

                let sterge = document.createElement("button");
                sterge.textContent = "Șterge";
                sterge.onclick = function() {
                    stergeMasina(index);
                };

                actiuni.appendChild(modifica);
                actiuni.appendChild(sterge);
            });
        }

        // Adăugare / salvare mașină
        function salveazaMasina(event) {

            event.preventDefault();

            let masina = {
                marca: document.getElementById("marca").value,
                model: document.getElementById("model").value,
                culoare: document.getElementById("culoare").value
            };

            if (indexEditare === -1) {
                masini2Show.push(masina);
            } else {
                masini2Show[indexEditare] = masina;
            }

            reseteaza();
            actualizeazaJSON();
            afiseazaTabel();
        }

        // Modificare mașină
        function modificaMasina(index) {

            let masina = masini2Show[index];

            document.getElementById("marca").value = masina.marca;
            document.getElementById("model").value = masina.model;
            document.getElementById("culoare").value = masina.culoare;

            indexEditare = index;
        }

        // Ștergere mașină
        function stergeMasina(index) {

            if (confirm("Dorești să ștergi această mașină?")) {

                masini2Show.splice(index, 1);

                actualizeazaJSON();
                afiseazaTabel();
            }
        }

        // Actualizare conținut JSON
        function actualizeazaJSON() {

            fileContent = JSON.stringify(masini2Show, null, 4);

            document.getElementById("raw").textContent = fileContent;
        }

        // Resetare formular
        function reseteaza() {

            document.querySelector("form").reset();

            indexEditare = -1;
        }

    </script>

</body>
</html>
