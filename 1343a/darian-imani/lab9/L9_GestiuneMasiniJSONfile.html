
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestiune mașini JSON</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #ddd;
        }

        input {
            margin: 5px;
            padding: 7px;
        }

        button {
            padding: 7px 12px;
            margin: 5px;
            cursor: pointer;
        }

        #mesaj {
            margin-top: 15px;
            font-weight: bold;
        }

        #raw {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <h1>Gestiune mașini</h1>

    <button onclick="getAJAX('Masini_JSON.txt')">
        Încarcă array
    </button>

    <p id="mesaj"></p>

    <h3>Conținutul fișierului JSON:</h3>
    <pre id="raw"></pre>

    <h2>Lista mașinilor</h2>

    <table>
        <thead>
            <tr>
                <th>Marca</th>
                <th>Model</th>
                <th>Culoare</th>
                <th>Acțiuni</th>
            </tr>
        </thead>

        <tbody id="tabelMasini"></tbody>
    </table>

    <h2>Adaugă / Modifică mașină</h2>

    <form id="formular" onsubmit="salveazaMasina(event)">
        <input type="text" id="marca" placeholder="Marca" required>
        <input type="text" id="model" placeholder="Model" required>
        <input type="text" id="culoare" placeholder="Culoare" required>

        <button type="submit">Salvează</button>
        <button type="button" onclick="reseteazaFormular()">Anulează</button>
    </form>

    <script>
        let fileContent = "";
        let masini2Show = [];
        let indexEditare = -1;

        // ÎNCĂRCARE ARRAY DIN FIȘIER
        async function getAJAX(file) {
            try {
                const url = new URL(file, window.location.href);

                document.getElementById("mesaj").textContent =
                    "Se incearca incarcarea: " + url.href;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Eroare HTTP: " + response.status);
                }

                fileContent = await response.text();

                document.getElementById("raw").textContent = fileContent;

                masini2Show = JSON.parse(fileContent);

                document.getElementById("mesaj").textContent =
                    "Array incarcat cu succes!";

                afiseazaTabel();

            } catch (error) {
                console.error(error);

                document.getElementById("mesaj").textContent =
                    "Eroare: " + error.message;
            }
        }

        // AFIȘARE TABEL
        function afiseazaTabel() {
            const tabel = document.getElementById("tabelMasini");
            tabel.innerHTML = "";

            masini2Show.forEach((masina, index) => {
                const rand = document.createElement("tr");

                const valori = [
                    masina.marca,
                    masina.model,
                    masina.culoare
                ];

                valori.forEach(valoare => {
                    const celula = document.createElement("td");
                    celula.textContent = valoare;
                    rand.appendChild(celula);
                });

                const actiuni = document.createElement("td");

                const butonModifica = document.createElement("button");
                butonModifica.textContent = "Modifică";
                butonModifica.onclick = () => modificaMasina(index);

                const butonSterge = document.createElement("button");
                butonSterge.textContent = "Șterge";
                butonSterge.onclick = () => stergeMasina(index);

                actiuni.appendChild(butonModifica);
                actiuni.appendChild(butonSterge);

                rand.appendChild(actiuni);
                tabel.appendChild(rand);
            });
        }

        // ADAUGARE SAU MODIFICARE
        function salveazaMasina(event) {
            event.preventDefault();

            const masina = {
                marca: document.getElementById("marca").value,
                model: document.getElementById("model").value,
                culoare: document.getElementById("culoare").value
            };

            if (indexEditare === -1) {
                masini2Show.push(masina);
            } else {
                masini2Show[indexEditare] = masina;
            }

            reseteazaFormular();
            salveazaLocal();
            afiseazaTabel();
        }

        // MODIFICARE MAȘINĂ
        function modificaMasina(index) {
            const masina = masini2Show[index];

            document.getElementById("marca").value = masina.marca;
            document.getElementById("model").value = masina.model;
            document.getElementById("culoare").value = masina.culoare;

            indexEditare = index;
        }

        // ȘTERGERE MAȘINĂ
        function stergeMasina(index) {
            if (confirm("Sigur dorești să ștergi această mașină?")) {
                masini2Show.splice(index, 1);
                salveazaLocal();
                afiseazaTabel();
            }
        }

        // RESETARE FORMULAR
        function reseteazaFormular() {
            document.getElementById("formular").reset();
            indexEditare = -1;
        }

        // SALVARE LOCALĂ
        function salveazaLocal() {
            localStorage.setItem(
                "masiniArray",
                JSON.stringify(masini2Show)
            );
        }
    </script>

</body>
</html>
