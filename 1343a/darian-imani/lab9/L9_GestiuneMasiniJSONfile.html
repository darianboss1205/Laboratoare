
<!DOCTYPE html>
<html>
<head>
    <title>Tabel masini</title>

    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        * {
            box-sizing: border-box;
        }

        .formPopup {
            display: none;
            position: fixed;
            left: 45%;
            top: 5%;
            transform: translate(-50%, 5%);
            border: 3px solid #999999;
            z-index: 9;
        }

        .formContainer {
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
        }

        .formContainer input[type=text] {
            width: 80%;
            padding: 15px;
            margin: 5px 0 20px 0;
            border: none;
            background: #eee;
        }
    </style>
</head>

<body>

    <h1>Masini incarcate de pe server</h1>

    <p>
        <button onclick="getAJAX('Masini_JSON.txt')">
            Incarca array masini de pe server
        </button>

        <br><br><br>

        <button onclick="loadTable()">
            Incarca tabel masini
        </button>

        <br><br><br>

        <button onclick="openFormA()">
            Adauga masina
        </button>

        <table id="tm">
            <tr>
                <th>Marca</th>
                <th>Model</th>
                <th>Culoare</th>
                <th colspan="2" style="text-align:center">Operatii</th>
            </tr>
        </table>
    </p>

    <div><span id="raw"></span></div>

    <!-- Formular adaugare -->
    <div class="formPopup" id="adauga">
        <form action="javascript:;" onsubmit="adaugaMasina(this)" class="formContainer">

            <h2>Adauga masina</h2>

            <label for="marca"><strong>Marca</strong></label>
            <input type="text" id="marca" placeholder="Marca masinii"
                   name="marca" required>

            <label for="model"><strong>Model</strong></label>
            <input type="text" id="model" placeholder="Modelul masinii"
                   name="model" required>

            <label for="culoare"><strong>Culoare</strong></label>
            <input type="text" id="culoare" placeholder="Culoarea masinii"
                   name="culoare" required>

            <button type="submit" class="btn">Adauga</button>
            <button type="button" class="btn cancel"
                    onclick="closeForm('adauga')">Close</button>
        </form>
    </div>

    <!-- Formular modificare -->
    <div class="formPopup" id="modifica">
        <form action="javascript:;" onsubmit="modificaMasina()" class="formContainer">

            <h2>Modifica masina</h2>

            <label for="marcaM"><strong>Marca</strong></label>
            <input type="text" id="marcaM" placeholder="Marca masinii"
                   required>

            <label for="modelM"><strong>Model</strong></label>
            <input type="text" id="modelM" placeholder="Modelul masinii"
                   required>

            <label for="culoareM"><strong>Culoare</strong></label>
            <input type="text" id="culoareM" placeholder="Culoarea masinii"
                   required>

            <button type="submit" class="btn">Modifica</button>
            <button type="button" class="btn cancel"
                    onclick="closeForm('modifica')">Close</button>
        </form>
    </div>

    <script>
        let masini2Show = [];
        let fileContent = "";
        let nr = 0;

        // Continutul fisierului Masini_JSON.txt
        const masiniJSON = `[
            {
                "marca": "Dacia",
                "model": "Logan",
                "culoare": "albastra",
                "randNou": "<tr><td>Dacia</td><td>Logan</td><td>albastra</td>"
            },
            {
                "marca": "Nissan",
                "model": "Quasqai",
                "culoare": "verde",
                "randNou": "<tr><td>Nissan</td><td>Quasqai</td><td>verde</td>"
            },
            {
                "marca": "AlaBala",
                "model": "PortoCala",
                "culoare": "grena",
                "randNou": "<tr><td>AlaBala</td><td>PortoCala</td><td>grena</td>"
            },
            {
                "marca": "Grand Jeep",
                "model": "Cherokee",
                "culoare": "negru",
                "randNou": "<tr><td>Grand Jeep</td><td>Cherokee</td><td>negru</td>"
            }
        ]`;

        // Incarcare array
        function getAJAX(file) {
            fileContent = masiniJSON;

            document.getElementById("raw").textContent = fileContent;

            document.getElementById("mesaj");

            masini2Show = [];

            document.getElementById("raw").textContent =
                "Array-ul din " + file + " a fost incarcat.";
        }

        // Construire rand masina
        function masina(mk, md, cl) {
            this.marca = mk;
            this.model = md;
            this.culoare = cl;

            this.randNou = function() {
                return "<tr><td>" + this.marca +
                    "</td><td>" + this.model +
                    "</td><td>" + this.culoare + "</td>";
            };
        }

        // Incarcare tabel
        function loadTable() {
            if (fileContent === "") {
                alert("Apasa mai intai Incarca array masini de pe server!");
                return;
            }

            masini2Show = JSON.parse(fileContent);

            document.getElementById("tm").innerHTML =
                "<tr><th>Marca</th><th>Model</th><th>Culoare</th>" +
                "<th colspan='2' style='text-align:center'>Operatii</th></tr>";

            afiseazaMasini();
        }

        // Afisare masini
        function afiseazaMasini() {
            let tabel = document.getElementById("tm");

            tabel.innerHTML =
                "<tr><th>Marca</th><th>Model</th><th>Culoare</th>" +
                "<th colspan='2' style='text-align:center'>Operatii</th></tr>";

            for (let i = 0; i < masini2Show.length; i++) {
                let m = masini2Show[i];

                let rand = new masina(m.marca, m.model, m.culoare);

                tabel.innerHTML += rand.randNou() +
                    "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" +
                    "<td><button onclick='stergeMasina(" + i + ")'>Stergere</button></td></tr>";
            }
        }

        // Adaugare masina
        function adaugaMasina(frm) {
            let mNoua = new masina(
                frm.marca.value,
                frm.model.value,
                frm.culoare.value
            );

            masini2Show.push(mNoua);

            localStorage.setItem("carsArray", JSON.stringify(masini2Show));

            afiseazaMasini();

            frm.reset();
            closeForm("adauga");
        }

        // Deschidere formular modificare
        function openForm(rand) {
            nr = rand;

            document.getElementById("modifica").style.display = "block";

            document.getElementById("marcaM").value =
                masini2Show[nr].marca;

            document.getElementById("modelM").value =
                masini2Show[nr].model;

            document.getElementById("culoareM").value =
                masini2Show[nr].culoare;
        }

        // Modificare masina
        function modificaMasina() {
            let mMod = new masina(
                document.getElementById("marcaM").value,
                document.getElementById("modelM").value,
                document.getElementById("culoareM").value
            );

            masini2Show.splice(nr, 1, mMod);

            localStorage.setItem("carsArray", JSON.stringify(masini2Show));

            afiseazaMasini();

            closeForm("modifica");
        }

        // Stergere masina
        function stergeMasina(nr) {
            if (confirm("Sigur doresti sa stergi masina?")) {
                masini2Show.splice(nr, 1);

                localStorage.setItem("carsArray", JSON.stringify(masini2Show));

                afiseazaMasini();
            }
        }

        // Deschidere formular adaugare
        function openFormA() {
            document.getElementById("adauga").style.display = "block";
        }

        // Inchidere formular
        function closeForm(opt) {
            document.getElementById(opt).style.display = "none";
        }
    </script>

</body>
</html>
