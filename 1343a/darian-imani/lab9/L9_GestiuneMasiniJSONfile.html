

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Gestiune masini</title>
</head>
<body>

<h1>Gestiune masini</h1>

<button onclick="getAJAX('Masini_JSON.txt')">Incarca array</button>
<button onclick="loadTable()">Incarca tabel</button>
<button onclick="deschideAdaugare()">Adauga masina</button>

<h2>Continut JSON</h2>
<pre id="raw"></pre>

<p id="mesaj"></p>

<h2>Tabel masini</h2>

<table border="1" id="tabel">
    <thead>
        <tr>
            <th>Marca</th>
            <th>Model</th>
            <th>Culoare</th>
            <th>Actiuni</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="formular" style="display:none;">
    <h2 id="titluFormular">Adauga masina</h2>

    <form id="formMasina">
        Marca:
        <input type="text" id="marca" required>
        <br><br>

        Model:
        <input type="text" id="model" required>
        <br><br>

        Culoare:
        <input type="text" id="culoare" required>
        <br><br>

        <button type="submit">Salveaza</button>
        <button type="button" onclick="inchideFormular()">Anuleaza</button>
    </form>
</div>

<script>
let fileContent = "";
let masini2Show = [];
let indexEditat = -1;

async function getAJAX(file) {
    try {
        const response = await fetch(file);

        if (!response.ok) {
            throw new Error("Fisierul nu a putut fi incarcat: " + response.status);
        }

        fileContent = await response.text();

        document.getElementById("raw").textContent = fileContent;

        const masiniDinFisier = JSON.parse(fileContent);

        const salvate = localStorage.getItem("masiniArray");

        if (salvate) {
            masini2Show = JSON.parse(salvate);
        } else {
            masini2Show = masiniDinFisier;
        }

        document.getElementById("mesaj").textContent =
            "Array-ul a fost incarcat!";

    } catch (error) {
        console.error(error);
        document.getElementById("mesaj").textContent =
            "Eroare: " + error.message;
    }
}

function loadTable() {
    if (!fileContent && !localStorage.getItem("masiniArray")) {
        alert("Mai intai incarca array-ul!");
        return;
    }

    try {
        const salvate = localStorage.getItem("masiniArray");

        if (salvate) {
            masini2Show = JSON.parse(salvate);
        } else {
            masini2Show = JSON.parse(fileContent);
        }

        afiseazaTabel();

    } catch (error) {
        alert("Eroare la citirea JSON: " + error.message);
    }
}

function afiseazaTabel() {
    const tbody = document.querySelector("#tabel tbody");

    tbody.innerHTML = "";

    masini2Show.forEach((masina, index) => {

        const rand = document.createElement("tr");

        rand.innerHTML = `
            <td>${masina.marca}</td>
            <td>${masina.model}</td>
            <td>${masina.culoare}</td>
        `;

        const celulaActiuni = document.createElement("td");

        const btnModifica = document.createElement("button");
        btnModifica.textContent = "Modifica";
        btnModifica.onclick = () => deschideModificare(index);

        const btnSterge = document.createElement("button");
        btnSterge.textContent = "Sterge";
        btnSterge.onclick = () => stergeMasina(index);

        celulaActiuni.appendChild(btnModifica);
        celulaActiuni.appendChild(btnSterge);

        rand.appendChild(celulaActiuni);
        tbody.appendChild(rand);
    });
}

function deschideAdaugare() {
    indexEditat = -1;

    document.getElementById("titluFormular").textContent =
        "Adauga masina";

    document.getElementById("formMasina").reset();

    document.getElementById("formular").style.display = "block";
}

function deschideModificare(index) {
    indexEditat = index;

    const masina = masini2Show[index];

    document.getElementById("marca").value = masina.marca;
    document.getElementById("model").value = masina.model;
    document.getElementById("culoare").value = masina.culoare;

    document.getElementById("titluFormular").textContent =
        "Modifica masina";

    document.getElementById("formular").style.display = "block";
}

document.getElementById("formMasina").addEventListener("submit", function(event) {

    event.preventDefault();

    const masinaNoua = {
        marca: document.getElementById("marca").value,
        model: document.getElementById("model").value,
        culoare: document.getElementById("culoare").value
    };

    if (indexEditat === -1) {
        masini2Show.push(masinaNoua);
    } else {
        masini2Show[indexEditat] = masinaNoua;
    }

    salveazaDate();
    afiseazaTabel();
    inchideFormular();
});

function stergeMasina(index) {
    if (confirm("Sigur doresti sa stergi masina?")) {

        masini2Show.splice(index, 1);

        salveazaDate();
        afiseazaTabel();
    }
}

function salveazaDate() {
    localStorage.setItem(
        "masiniArray",
        JSON.stringify(masini2Show)
    );
}

function inchideFormular() {
    document.getElementById("formular").style.display = "none";
    document.getElementById("formMasina").reset();
}

</script>

</body>
</html>
