
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Gestiune melodii</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: lightgray;
        }

        button {
            margin: 5px;
            padding: 7px;
        }

        input {
            padding: 7px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h2>Gestiune melodii folosind JSON</h2>

    <button onclick="getAJAX()">Încarcă array</button>

    <p id="mesaj"></p>

    <h3>Conținut JSON:</h3>
    <pre id="raw"></pre>

    <h3>Lista melodiilor:</h3>

    <table>
        <thead>
            <tr>
                <th>Titlu</th>
                <th>Muzică</th>
                <th>Versuri</th>
                <th>Interpretare</th>
                <th>Acțiuni</th>
            </tr>
        </thead>

        <tbody id="tabelMelodii"></tbody>
    </table>

    <h3>Adaugă / Modifică melodie</h3>

    <form onsubmit="salveazaMelodie(event)">
        <input type="text" id="titlu" placeholder="Titlu" required>
        <input type="text" id="muzica" placeholder="Muzică" required>
        <input type="text" id="versuri" placeholder="Versuri" required>
        <input type="text" id="interpretare" placeholder="Interpretare" required>

        <button type="submit">Adaugă / Salvează</button>
        <button type="button" onclick="reseteaza()">Anulează</button>
    </form>

    <script>

        let fileContent = "";
        let melodii2Show = [];
        let indexEditare = -1;

        // Datele preluate din Melodii_JSON.txt
        const melodiiJSON = `[
            {
                "titlu": "Thunderstruck",
                "muzica": "Angus",
                "versuri": "Malcolm",
                "interpretare": "AC/DC"
            },
            {
                "titlu": "Slow Low",
                "muzica": "Jason",
                "versuri": "Derulo",
                "interpretare": "Jason Derulo"
            },
            {
                "titlu": "With or Without You",
                "muzica": "The Edge",
                "versuri": "Bono",
                "interpretare": "U2"
            }
        ]`;

        // Încărcare array
        function getAJAX() {

            fileContent = melodiiJSON;

            document.getElementById("raw").textContent = fileContent;

            melodii2Show = JSON.parse(fileContent);

            document.getElementById("mesaj").textContent =
                "Array incarcat cu succes!";

            afiseazaTabel();
        }

        // Afișare tabel
        function afiseazaTabel() {

            let tabel = document.getElementById("tabelMelodii");

            tabel.innerHTML = "";

            melodii2Show.forEach((melodie, index) => {

                let rand = tabel.insertRow();

                rand.insertCell().textContent = melodie.titlu;
                rand.insertCell().textContent = melodie.muzica;
                rand.insertCell().textContent = melodie.versuri;
                rand.insertCell().textContent = melodie.interpretare;

                let actiuni = rand.insertCell();

                let modifica = document.createElement("button");
                modifica.textContent = "Modifică";
                modifica.onclick = function() {
                    modificaMelodie(index);
                };

                let sterge = document.createElement("button");
                sterge.textContent = "Șterge";
                sterge.onclick = function() {
                    stergeMelodie(index);
                };

                actiuni.appendChild(modifica);
                actiuni.appendChild(sterge);
            });
        }

        // Adăugare / salvare melodie
        function salveazaMelodie(event) {

            event.preventDefault();

            let melodie = {
                titlu: document.getElementById("titlu").value,
                muzica: document.getElementById("muzica").value,
                versuri: document.getElementById("versuri").value,
                interpretare: document.getElementById("interpretare").value
            };

            if (indexEditare === -1) {
                melodii2Show.push(melodie);
            } else {
                melodii2Show[indexEditare] = melodie;
            }

            reseteaza();
            actualizeazaJSON();
            afiseazaTabel();
        }

        // Modificare melodie
        function modificaMelodie(index) {

            let melodie = melodii2Show[index];

            document.getElementById("titlu").value = melodie.titlu;
            document.getElementById("muzica").value = melodie.muzica;
            document.getElementById("versuri").value = melodie.versuri;
            document.getElementById("interpretare").value =
                melodie.interpretare;

            indexEditare = index;
        }

        // Ștergere melodie
        function stergeMelodie(index) {

            if (confirm("Dorești să ștergi această melodie?")) {

                melodii2Show.splice(index, 1);

                actualizeazaJSON();
                afiseazaTabel();
            }
        }

        // Actualizare conținut JSON
        function actualizeazaJSON() {

            fileContent = JSON.stringify(melodii2Show, null, 4);

            document.getElementById("raw").textContent = fileContent;
        }

        // Resetare formular
        function reseteaza() {

            document.querySelector("form").reset();

            indexEditare = -1;
        }

    </script>

</body>
</html>
