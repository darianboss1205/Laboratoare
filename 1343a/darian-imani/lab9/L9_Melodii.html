
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestiune melodii JSON</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #ddd;
        }

        input {
            margin: 5px;
            padding: 7px;
        }

        button {
            padding: 7px 12px;
            margin: 5px;
            cursor: pointer;
        }

        #mesaj {
            margin-top: 15px;
            font-weight: bold;
        }

        #raw {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <h1>Gestiune melodii</h1>

    <button onclick="getAJAX('Melodii_JSON.txt')">
        Încarcă array
    </button>

    <p id="mesaj"></p>

    <h3>Conținutul fișierului JSON:</h3>
    <pre id="raw"></pre>

    <h2>Lista melodiilor</h2>

    <table>
        <thead>
            <tr>
                <th>Titlu</th>
                <th>Muzică</th>
                <th>Versuri</th>
                <th>Interpretare</th>
                <th>Acțiuni</th>
            </tr>
        </thead>

        <tbody id="tabelMelodii"></tbody>
    </table>

    <h2>Adaugă / Modifică melodie</h2>

    <form id="formular" onsubmit="salveazaMelodie(event)">
        <input type="text" id="titlu" placeholder="Titlu" required>
        <input type="text" id="muzica" placeholder="Muzică" required>
        <input type="text" id="versuri" placeholder="Versuri" required>
        <input type="text" id="interpretare" placeholder="Interpretare" required>

        <button type="submit">Salvează</button>
        <button type="button" onclick="reseteazaFormular()">Anulează</button>
    </form>

    <script>
        let fileContent = "";
        let melodii2Show = [];
        let indexEditare = -1;

        // ÎNCĂRCARE ARRAY DIN FIȘIER
        async function getAJAX(file) {
            try {
                const url = new URL(file, window.location.href);

                document.getElementById("mesaj").textContent =
                    "Se incearca incarcarea: " + url.href;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Eroare HTTP: " + response.status);
                }

                fileContent = await response.text();

                document.getElementById("raw").textContent = fileContent;

                melodii2Show = JSON.parse(fileContent);

                document.getElementById("mesaj").textContent =
                    "Array incarcat cu succes!";

                afiseazaTabel();

            } catch (error) {
                console.error(error);

                document.getElementById("mesaj").textContent =
                    "Eroare: " + error.message;
            }
        }

        // AFIȘARE TABEL
        function afiseazaTabel() {
            const tabel = document.getElementById("tabelMelodii");
            tabel.innerHTML = "";

            melodii2Show.forEach((melodie, index) => {
                const rand = document.createElement("tr");

                const valori = [
                    melodie.titlu,
                    melodie.muzica,
                    melodie.versuri,
                    melodie.interpretare
                ];

                valori.forEach(valoare => {
                    const celula = document.createElement("td");
                    celula.textContent = valoare;
                    rand.appendChild(celula);
                });

                const actiuni = document.createElement("td");

                const butonModifica = document.createElement("button");
                butonModifica.textContent = "Modifică";
                butonModifica.onclick = () => modificaMelodie(index);

                const butonSterge = document.createElement("button");
                butonSterge.textContent = "Șterge";
                butonSterge.onclick = () => stergeMelodie(index);

                actiuni.appendChild(butonModifica);
                actiuni.appendChild(butonSterge);

                rand.appendChild(actiuni);
                tabel.appendChild(rand);
            });
        }

        // ADAUGARE SAU MODIFICARE
        function salveazaMelodie(event) {
            event.preventDefault();

            const melodie = {
                titlu: document.getElementById("titlu").value,
                muzica: document.getElementById("muzica").value,
                versuri: document.getElementById("versuri").value,
                interpretare: document.getElementById("interpretare").value
            };

            if (indexEditare === -1) {
                melodii2Show.push(melodie);
            } else {
                melodii2Show[indexEditare] = melodie;
            }

            reseteazaFormular();
            salveazaLocal();
            afiseazaTabel();
        }

        // MODIFICARE MELODIE
        function modificaMelodie(index) {
            const melodie = melodii2Show[index];

            document.getElementById("titlu").value = melodie.titlu;
            document.getElementById("muzica").value = melodie.muzica;
            document.getElementById("versuri").value = melodie.versuri;
            document.getElementById("interpretare").value =
                melodie.interpretare;

            indexEditare = index;
        }

        // ȘTERGERE MELODIE
        function stergeMelodie(index) {
            if (confirm("Sigur dorești să ștergi această melodie?")) {
                melodii2Show.splice(index, 1);
                salveazaLocal();
                afiseazaTabel();
            }
        }

        // RESETARE FORMULAR
        function reseteazaFormular() {
            document.getElementById("formular").reset();
            indexEditare = -1;
        }

        // SALVARE LOCALĂ
        function salveazaLocal() {
            localStorage.setItem(
                "songsArray",
                JSON.stringify(melodii2Show)
            );
        }
    </script>

</body>
</html>
