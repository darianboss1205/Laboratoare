<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Gestiune melodii JSON</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: lightgray;
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        button {
            margin: 5px;
            padding: 6px 10px;
            cursor: pointer;
        }

        #formular {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid gray;
            width: 350px;
        }
    </style>
</head>

<body>

    <h1>Gestiune melodii</h1>

    <button onclick="loadTable()">Încarcă melodiile</button>
    <button onclick="openForm()">Adaugă melodie</button>

    <div id="tabel"></div>

    <div id="formular">
        <h3 id="titluFormular">Adaugă melodie</h3>

        <form id="frm">
            <label>Titlu:</label>
            <input type="text" id="titlu" required>
            <br>

            <label>Muzică:</label>
            <input type="text" id="muzica" required>
            <br>

            <label>Versuri:</label>
            <input type="text" id="versuri" required>
            <br>

            <label>Interpretare:</label>
            <input type="text" id="interpretare" required>
            <br>

            <button type="button" onclick="salveazaMelodie()">
                Salvează
            </button>

            <button type="button" onclick="closeForm()">
                Anulează
            </button>
        </form>
    </div>

    <script>
        let melodii = [];
        let indexModificare = -1;

        // Constructorul pentru obiectul melodie
        function Melodie(titlu, muzica, versuri, interpretare) {
            this.titlu = titlu;
            this.muzica = muzica;
            this.versuri = versuri;
            this.interpretare = interpretare;
        }

        // Încarcă datele din fișierul JSON
        function getAJAX(url) {
            return fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Fișierul nu a putut fi încărcat.");
                    }
                    return response.json();
                });
        }

        function loadTable() {
            getAJAX("Melodii_JSON.txt")
                .then(data => {
                    melodii = [];

                    data.forEach(element => {
                        let melodie = new Melodie(
                            element.titlu,
                            element.muzica,
                            element.versuri,
                            element.interpretare
                        );

                        melodii.push(melodie);
                    });

                    afiseazaTabel();
                })
                .catch(error => {
                    alert("Eroare: " + error.message);
                });
        }

        // Afișează tabelul cu melodii
        function afiseazaTabel() {
            let html = `
                <table>
                    <tr>
                        <th>Titlu</th>
                        <th>Muzică</th>
                        <th>Versuri</th>
                        <th>Interpretare</th>
                        <th>Acțiuni</th>
                    </tr>
            `;

            melodii.forEach((melodie, index) => {
                html += `
                    <tr>
                        <td>${melodie.titlu}</td>
                        <td>${melodie.muzica}</td>
                        <td>${melodie.versuri}</td>
                        <td>${melodie.interpretare}</td>
                        <td>
                            <button onclick="modificaMelodie(${index})">
                                Modifică
                            </button>

                            <button onclick="stergeMelodie(${index})">
                                Șterge
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += "</table>";

            document.getElementById("tabel").innerHTML = html;
        }

        // Șterge o melodie
        function stergeMelodie(index) {
            if (confirm("Sigur dorești să ștergi această melodie?")) {
                melodii.splice(index, 1);
                afiseazaTabel();
            }
        }

        // Deschide formularul pentru adăugare
        function openForm() {
            indexModificare = -1;

            document.getElementById("titluFormular").innerText =
                "Adaugă melodie";

            document.getElementById("frm").reset();

            document.getElementById("formular").style.display = "block";
        }

        // Deschide formularul pentru modificare
        function modificaMelodie(index) {
            indexModificare = index;

            let melodie = melodii[index];

            document.getElementById("titlu").value = melodie.titlu;
            document.getElementById("muzica").value = melodie.muzica;
            document.getElementById("versuri").value = melodie.versuri;
            document.getElementById("interpretare").value =
                melodie.interpretare;

            document.getElementById("titluFormular").innerText =
                "Modifică melodia";

            document.getElementById("formular").style.display = "block";
        }

        // Salvează o melodie nouă sau modificările
        function salveazaMelodie() {
            let titlu = document.getElementById("titlu").value;
            let muzica = document.getElementById("muzica").value;
            let versuri = document.getElementById("versuri").value;
            let interpretare =
                document.getElementById("interpretare").value;

            if (!titlu || !muzica || !versuri || !interpretare) {
                alert("Completează toate câmpurile!");
                return;
            }

            let melodieNoua = new Melodie(
                titlu,
                muzica,
                versuri,
                interpretare
            );

            if (indexModificare === -1) {
                melodii.push(melodieNoua);
            } else {
                melodii[indexModificare] = melodieNoua;
            }

            afiseazaTabel();
            closeForm();
        }

        // Închide formularul
        function closeForm() {
            document.getElementById("formular").style.display = "none";
            document.getElementById("frm").reset();
        }
    </script>

</body>
</html>
