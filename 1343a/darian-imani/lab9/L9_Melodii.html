
<!DOCTYPE html>
<html>
<head>
    <title>Tabel melodii</title>

    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        * {
            box-sizing: border-box;
        }

        .loginPopup {
            position: relative;
            text-align: center;
            width: 100%;
        }

        .formPopup {
            display: none;
            position: fixed;
            left: 45%;
            top: 5%;
            transform: translate(-50%, 5%);
            border: 3px solid #999999;
            z-index: 9;
        }

        .formContainer {
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
        }

        .formContainer input[type=text] {
            width: 80%;
            padding: 15px;
            margin: 5px 0 20px 0;
            border: none;
            background: #eee;
        }
    </style>
</head>

<body>

<h1>Melodii incarcate de pe server</h1>

<p>

    <button onclick="getAJAX('Melodii_JSON.txt')">
        Incarca array melodii de pe server
    </button>

    <br><br><br>

    <button onclick="loadTable()">
        Incarca tabel melodii
    </button>

    <br><br><br>

    <button onclick="openFormA()">
        Adauga melodie
    </button>

    <table id="tm">
        <tr>
            <th>Titlu</th>
            <th>Interpretata de</th>
            <th>Versuri</th>
            <th>Muzica</th>
            <th colspan="2" style="text-align:center">
                Operatii
            </th>
        </tr>
    </table>

</p>

<div>
    <span id="raw"></span>
</div>


<!-- Formular adaugare melodie -->

<div class="formPopup" id="adauga">

    <form action="javascript:;"
          onsubmit="adaugaMelodie(this)"
          class="formContainer">

        <h2>Adauga melodie</h2>

        <label for="titlu">
            <strong>Titlu</strong>
        </label>

        <input type="text" id="titlu"
               placeholder="Titlul melodiei"
               name="titlu" required>

        <label for="interpretare">
            <strong>Interpret</strong>
        </label>

        <input type="text" id="interpretare"
               placeholder="Interpretul"
               name="interpretare" required>

        <label for="versuri">
            <strong>Versuri</strong>
        </label>

        <input type="text" id="versuri"
               placeholder="Autor versuri"
               name="versuri" required>

        <label for="muzica">
            <strong>Muzica</strong>
        </label>

        <input type="text" id="muzica"
               placeholder="Autor muzica"
               name="muzica" required>

        <button type="submit" class="btn">
            Adauga
        </button>

        <button type="button" class="btn cancel"
                onclick="closeForm('adauga')">
            Close
        </button>

    </form>

</div>


<!-- Formular modificare melodie -->

<div class="formPopup" id="modifica">

    <form action="javascript:;"
          onsubmit="modificaMelodie(this)"
          class="formContainer">

        <h2>Modifica melodie</h2>

        <label for="titluM">
            <strong>Titlu</strong>
        </label>

        <input type="text" id="titluM"
               placeholder="Titlul melodiei"
               name="titlu" required>

        <label for="interpretareM">
            <strong>Interpret</strong>
        </label>

        <input type="text" id="interpretareM"
               placeholder="Interpretul"
               name="interpretare" required>

        <label for="versuriM">
            <strong>Versuri</strong>
        </label>

        <input type="text" id="versuriM"
               placeholder="Autor versuri"
               name="versuri" required>

        <label for="muzicaM">
            <strong>Muzica</strong>
        </label>

        <input type="text" id="muzicaM"
               placeholder="Autor muzica"
               name="muzica" required>

        <button type="submit" class="btn">
            Modifica
        </button>

        <button type="button" class="btn cancel"
                onclick="closeForm('modifica')">
            Close
        </button>

    </form>

</div>


<script>

const melodii2Show = [];

let fileContent;
let nr = 0;


// Incarcare fisier JSON de pe server

async function getAJAX(file) {

    try {

        let myObject = await fetch(file);

        if (!myObject.ok) {
            throw new Error("Fisierul nu a putut fi incarcat");
        }

        fileContent = await myObject.text();

    }
    catch (e) {

        console.log(e);

        alert("Eroare la incarcarea fisierului JSON");

    }

}


// Functia de afisare a tabelului

function afiseazaTabel() {

    document.getElementById("tm").innerHTML =
        "<tr>" +
        "<th>Titlu</th>" +
        "<th>Interpretata de</th>" +
        "<th>Versuri</th>" +
        "<th>Muzica</th>" +
        "<th colspan='2' style='text-align:center'>Operatii</th>" +
        "</tr>";

    for (let i = 0; i < melodii2Show.length; i++) {

        let m = new melodie(
            melodii2Show[i].titlu,
            melodii2Show[i].muzica,
            melodii2Show[i].versuri,
            melodii2Show[i].interpretare
        );

        document.getElementById("tm").innerHTML +=
            m.randNou() +
            "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" +
            "<td><button onclick='stergeMelodie(" + i + ")'>Stergere</button></td>" +
            "</tr>";

    }

}


// Incarcarea datelor in tabel

function loadTable() {

    if (!fileContent) {

        alert("Mai intai incarcati array-ul de melodii!");

        return;

    }

    document.getElementById("raw").innerHTML = fileContent;

    try {

        var melodiiStored = JSON.parse(fileContent);

        // Golim tabloul pentru a evita dublarea randurilor

        melodii2Show.length = 0;

        for (let i = 0; i < melodiiStored.length; i++) {

            melodii2Show.push(melodiiStored[i]);

        }

        afiseazaTabel();

    }
    catch (e) {

        console.log(e);

        alert("Eroare la citirea datelor JSON");

    }

}


// Constructorul pentru melodie

function melodie(ti, mu, ve, i) {

    this.titlu = ti;

    this.muzica = mu;

    this.versuri = ve;

    this.interpretare = i;

    this.randNou = function() {

        return "<tr><td>" + this.titlu +
            "</td><td>" + this.interpretare +
            "</td><td>" + this.versuri +
            "</td><td>" + this.muzica +
            "</td>";

    }

}


// Stergerea unei melodii

function stergeMelodie(nr) {

    melodii2Show.splice(nr, 1);

    var myJSON = JSON.stringify(melodii2Show);

    localStorage.setItem("songsArray", myJSON);

    afiseazaTabel();

}


// Adaugarea unei melodii

function adaugaMelodie(frm) {

    var mNoua = new melodie(
        frm.titlu.value,
        frm.muzica.value,
        frm.versuri.value,
        frm.interpretare.value
    );

    melodii2Show.push(mNoua);

    var myJSON = JSON.stringify(melodii2Show);

    localStorage.setItem("songsArray", myJSON);

    afiseazaTabel();

    frm.reset();

    closeForm("adauga");

}


// Deschiderea formularului de adaugare

function openFormA() {

    document.getElementById("adauga").style.display = "block";

}


// Deschiderea formularului de modificare

function openForm(rand) {

    let frm = document.getElementById("modifica");

    frm.style.display = "block";

    nr = rand;

    document.getElementById("titluM").value =
        melodii2Show[nr].titlu;

    document.getElementById("interpretareM").value =
        melodii2Show[nr].interpretare;

    document.getElementById("versuriM").value =
        melodii2Show[nr].versuri;

    document.getElementById("muzicaM").value =
        melodii2Show[nr].muzica;

}


// Modificarea unei melodii

function modificaMelodie(frm) {

    var mMod = new melodie(
        frm.titlu.value,
        frm.muzica.value,
        frm.versuri.value,
        frm.interpretare.value
    );

    melodii2Show.splice(nr, 1, mMod);

    var myJSON = JSON.stringify(melodii2Show);

    localStorage.setItem("songsArray", myJSON);

    afiseazaTabel();

    frm.reset();

    closeForm("modifica");

}


// Inchiderea formularelor

function closeForm(opt) {

    document.getElementById(opt).style.display = "none";

}

</script>

</body>
</html>
