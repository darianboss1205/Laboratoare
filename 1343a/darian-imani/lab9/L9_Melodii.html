
<!DOCTYPE html>
<html>
<head>
    <title>Tabel melodii</title>

    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        * {
            box-sizing: border-box;
        }

        .formPopup {
            display: none;
            position: fixed;
            left: 45%;
            top: 5%;
            transform: translate(-50%, 5%);
            border: 3px solid #999999;
            z-index: 9;
        }

        .formContainer {
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
        }

        .formContainer input[type=text] {
            width: 80%;
            padding: 15px;
            margin: 5px 0 20px 0;
            border: none;
            background: #eee;
        }
    </style>
</head>

<body>

    <h1>Melodii incarcate de pe server</h1>

    <p>
        <button onclick="getAJAX('Melodii_JSON.txt')">
            Incarca array melodii de pe server
        </button>

        <br><br><br>

        <button onclick="loadTable()">
            Incarca tabel melodii
        </button>

        <br><br><br>

        <button onclick="openFormA()">
            Adauga melodie
        </button>

        <table id="tm">
            <tr>
                <th>Titlu</th>
                <th>Interpretata de</th>
                <th>Versuri</th>
                <th>Muzica</th>
                <th colspan="2" style="text-align:center">Operatii</th>
            </tr>
        </table>
    </p>

    <p id="mesaj"></p>

    <div><span id="raw"></span></div>

    <!-- Formular adaugare -->
    <div class="formPopup" id="adauga">
        <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">

            <h2>Adauga melodie</h2>

            <label for="titlu"><strong>Titlu</strong></label>
            <input type="text" id="titlu" placeholder="Titlul melodiei"
                   name="titlu" required>

            <label for="interpretare"><strong>Interpretata de</strong></label>
            <input type="text" id="interpretare" placeholder="Interpret"
                   name="interpretare" required>

            <label for="versuri"><strong>Versuri</strong></label>
            <input type="text" id="versuri" placeholder="Autor versuri"
                   name="versuri" required>

            <label for="muzica"><strong>Muzica</strong></label>
            <input type="text" id="muzica" placeholder="Autor muzica"
                   name="muzica" required>

            <button type="submit" class="btn">Adauga</button>
            <button type="button" class="btn cancel"
                    onclick="closeForm('adauga')">Close</button>
        </form>
    </div>

    <!-- Formular modificare -->
    <div class="formPopup" id="modifica">
        <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">

            <h2>Modifica melodie</h2>

            <label for="titluM"><strong>Titlu</strong></label>
            <input type="text" id="titluM" placeholder="Titlul melodiei"
                   required>

            <label for="interpretareM"><strong>Interpretata de</strong></label>
            <input type="text" id="interpretareM" placeholder="Interpret"
                   required>

            <label for="versuriM"><strong>Versuri</strong></label>
            <input type="text" id="versuriM" placeholder="Autor versuri"
                   required>

            <label for="muzicaM"><strong>Muzica</strong></label>
            <input type="text" id="muzicaM" placeholder="Autor muzica"
                   required>

            <button type="submit" class="btn">Modifica</button>
            <button type="button" class="btn cancel"
                    onclick="closeForm('modifica')">Close</button>
        </form>
    </div>

    <script>
        let melodii2Show = [];
        let fileContent = "";
        let nr = 0;

        // Continutul fisierului Melodii_JSON.txt
        const melodiiJSON = `[
            {
                "titlu": "Thunderstruck",
                "muzica": "Angus",
                "versuri": "Malcolm",
                "interpretare": "AC/DC"
            },
            {
                "titlu": "Slow Low",
                "muzica": "Jason",
                "versuri": "Derulo",
                "interpretare": "Jason Derulo"
            },
            {
                "titlu": "With or Without You",
                "muzica": "The Edge",
                "versuri": "Bono",
                "interpretare": "U2"
            }
        ]`;

        // Incarcare array
        function getAJAX(file) {
            fileContent = melodiiJSON;

            document.getElementById("mesaj").textContent =
                "Array-ul din " + file + " a fost incarcat.";

            document.getElementById("raw").textContent = fileContent;
        }

        // Construire obiect melodie
        function melodie(ti, mu, ve, i) {
            this.titlu = ti;
            this.muzica = mu;
            this.versuri = ve;
            this.interpretare = i;

            this.randNou = function() {
                return "<tr><td>" + this.titlu +
                    "</td><td>" + this.interpretare +
                    "</td><td>" + this.versuri +
                    "</td><td>" + this.muzica + "</td>";
            };
        }

        // Incarcare tabel
        function loadTable() {
            if (fileContent === "") {
                alert("Apasa mai intai Incarca array melodii de pe server!");
                return;
            }

            melodii2Show = JSON.parse(fileContent);

            document.getElementById("raw").textContent = fileContent;

            afiseazaMelodii();
        }

        // Afisare melodii
        function afiseazaMelodii() {
            let tabel = document.getElementById("tm");

            tabel.innerHTML =
                "<tr><th>Titlu</th><th>Interpretata de</th>" +
                "<th>Versuri</th><th>Muzica</th>" +
                "<th colspan='2' style='text-align:center'>Operatii</th></tr>";

            for (let i = 0; i < melodii2Show.length; i++) {
                let m = melodii2Show[i];

                let melodieCurenta = new melodie(
                    m.titlu,
                    m.muzica,
                    m.versuri,
                    m.interpretare
                );

                tabel.innerHTML += melodieCurenta.randNou() +
                    "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" +
                    "<td><button onclick='stergeMelodie(" + i + ")'>Stergere</button></td></tr>";
            }
        }

        // Adaugare melodie
        function adaugaMelodie(frm) {
            let mNoua = new melodie(
                frm.titlu.value,
                frm.muzica.value,
                frm.versuri.value,
                frm.interpretare.value
            );

            melodii2Show.push(mNoua);

            localStorage.setItem(
                "songsArray",
                JSON.stringify(melodii2Show)
            );

            afiseazaMelodii();

            frm.reset();
            closeForm("adauga");
        }

        // Deschidere formular modificare
        function openForm(rand) {
            nr = rand;

            document.getElementById("modifica").style.display = "block";

            document.getElementById("titluM").value =
                melodii2Show[nr].titlu;

            document.getElementById("interpretareM").value =
                melodii2Show[nr].interpretare;

            document.getElementById("versuriM").value =
                melodii2Show[nr].versuri;

            document.getElementById("muzicaM").value =
                melodii2Show[nr].muzica;
        }

        // Modificare melodie
        function modificaMelodie() {
            let mMod = new melodie(
                document.getElementById("titluM").value,
                document.getElementById("muzicaM").value,
                document.getElementById("versuriM").value,
                document.getElementById("interpretareM").value
            );

            melodii2Show.splice(nr, 1, mMod);

            localStorage.setItem(
                "songsArray",
                JSON.stringify(melodii2Show)
            );

            afiseazaMelodii();

            closeForm("modifica");
        }

        // Stergere melodie
        function stergeMelodie(nr) {
            if (confirm("Sigur doresti sa stergi melodia?")) {
                melodii2Show.splice(nr, 1);

                localStorage.setItem(
                    "songsArray",
                    JSON.stringify(melodii2Show)
                );

                afiseazaMelodii();
            }
        }

        // Deschidere formular adaugare
        function openFormA() {
            document.getElementById("adauga").style.display = "block";
        }

        // Inchidere formular
        function closeForm(opt) {
            document.getElementById(opt).style.display = "none";
        }
    </script>

</body>
</html>
